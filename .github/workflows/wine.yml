# Keeps Barrel's Wine up to date: every day, look for a new CrossOver source release from CodeWeavers,
# build it on an Apple Silicon runner, smoke-test it and publish it as a "wine-cx-<version>" release.
# The app and CLI install the newest of these releases.
name: Wine

on:
  schedule:
    - cron: "0 6 * * *"
  push:
    branches: [main]
    paths: ["engine/**", ".github/workflows/wine.yml"]
  workflow_dispatch:
    inputs:
      version:
        description: CrossOver version to build (empty for the newest)
        required: false
      force:
        description: Rebuild even if that version is already released
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: wine
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      build: ${{ steps.v.outputs.build }}
    steps:
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          FORCE: ${{ inputs.force }}
        run: |
          v=$VERSION
          if [ -z "$v" ]; then
            v=$(curl -fsSL -A 'Mozilla/5.0 (Macintosh; Intel Mac OS X 14_0)' https://www.codeweavers.com/crossover/source |
              grep -oE 'crossover-sources-[0-9.]+\.tar\.gz' | sed -E 's/crossover-sources-(.*)\.tar\.gz/\1/' | sort -V | tail -1)
          fi
          [ -n "$v" ] || { echo "::error::Couldn't find the newest CrossOver version"; exit 1; }
          build=true
          # A push changes the build itself, so it always rebuilds; otherwise only new versions are built.
          if [ "$GITHUB_EVENT_NAME" != push ] && [ "$FORCE" != true ] &&
             gh release view "wine-cx-$v" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            build=false
          fi
          echo "CrossOver $v, build: $build"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: macos-15
    timeout-minutes: 300
    env:
      VERSION: ${{ needs.check.outputs.version }}
      BARREL_HOME: ${{ github.workspace }}/.barrel-home
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Rosetta
        run: /usr/bin/arch -x86_64 /usr/bin/true 2>/dev/null || softwareupdate --install-rosetta --agree-to-license

      - name: Build Wine
        run: engine/build.sh "$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: barrel-wine-${{ needs.check.outputs.version }}
          path: dist/*.tar.xz
          retention-days: 7

      - name: Smoke test (bottle, fonts)
        env:
          BARREL_ENGINE_TARBALL: dist/barrel-wine-${{ needs.check.outputs.version }}.tar.xz
        run: |
          cli/barrel setup
          cli/barrel new test
          cli/barrel run test cmd /c ver | tee ver.txt
          grep -q 'Microsoft Windows' ver.txt
          x86_64-w64-mingw32-g++ -O1 -o tests/fonttest.exe tests/fonttest.cpp -static -lgdi32
          cli/barrel run test "$PWD/tests/fonttest.exe"

      - name: Graphics tests
        # Hosted runners are virtual machines, so Metal may be limited; report but don't block the release.
        continue-on-error: true
        run: |
          L="-static -ld3d9 -ld3d11 -ld3d12 -ldxgi -ld3dcompiler_47 -luuid"
          x86_64-w64-mingw32-g++ -O1 -o tests/gfxtest64.exe tests/gfxtest.cpp $L
          i686-w64-mingw32-g++ -O1 -o tests/gfxtest32.exe tests/gfxtest.cpp $L
          tests/run.sh cli/barrel

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="wine-cx-$VERSION"
          gh release view "$tag" >/dev/null 2>&1 ||
            gh release create "$tag" --latest=false --title "Wine (CrossOver $VERSION)" \
              --notes "Wine built from CodeWeavers' CrossOver $VERSION open-source release (LGPL), with Barrel's patches in engine/patches. Installed automatically by Barrel."
          gh release upload "$tag" "dist/barrel-wine-$VERSION.tar.xz" --clobber
